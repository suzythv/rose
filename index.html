<!DOCTYPE html>
<html>
<head>
  <title>Birthday Countdown 🎂</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    h1 {
      margin-top: 20%;
      font-size: 40px;
    }

    #btn {
      display: none;
      padding: 12px 25px;
      font-size: 20px;
      background: pink;
      border: none;
      cursor: pointer;
    }

    .cat {
      position: absolute;
      width: 100px;
      animation: move 6s linear infinite;
    }

    @keyframes move {
      from { left: -100px; }
      to { left: 100%; }
    }
  </style>
</head>

<body>

<h1 id="countdown">Loading...</h1>
<button id="btn" onclick="showWish()">Click for Surprise 🎁</button>

<div id="cats"></div>

<script>
  // 🎯 SET TARGET DATE (5 May 2026, 12:00 AM)
  let target = new Date("May 5, 2026 00:00:00").getTime();

  let countdown = document.getElementById("countdown");
  let btn = document.getElementById("btn");

  setInterval(() => {
    let now = new Date().getTime();
    let diff = target - now;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    let minutes = Math.floor((diff / (1000 * 60)) % 60);
    let seconds = Math.floor((diff / 1000) % 60);

    countdown.innerHTML =
      days + "d " + hours + "h " + minutes + "m " + seconds + "s";

    if (diff < 0) {
      countdown.innerHTML = "🎉 It's Time!";
      btn.style.display = "inline-block";
    }
  }, 1000);

  function showWish() {
    countdown.innerHTML = "🐱 Happy Birthday!!! 🎂💖";

    let cats = document.getElementById("cats");

    for (let i = 0; i < 6; i++) {
      let img = document.createElement("img");
      img.src = "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif";
      img.className = "cat";
      img.style.top = (Math.random() * 400) + "px";
      cats.appendChild(img);
    }
  }
</script>

</body>
</html>
