<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Surprise 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="home" class="page">
  <h1>🎂 Happy Birthday Eva 🎂</h1>

  <p id="countdown"></p>

  <button onclick="openSurprise()">Open Surprise 🎁</button>
</div>

<div id="surprise" class="page hidden">
  <h1>🎉 Surprise!</h1>

  <p id="message">You are not just a friend… you are someone really special to me  😄</p>

  <button onclick="nextMessage()">Next Message ➡️</button>
  <button onclick="playMusic()">🎵 Play Music</button>
  <button onclick="launchConfetti()">🎊 Confetti</button>
  <button onclick="backHome()">Back</button>

  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
</div>

<script src="script.js"></script>
</body>
</html>
